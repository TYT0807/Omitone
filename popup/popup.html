<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omitone-1.1.2</title>
<style>
:root{
  --bg:#fff; --fg:#16181d; --muted:#8a8f98; --line:#eceef1; --line-strong:#dcdfe4;
  --soft:#f7f8fa; --accent:#16181d; --accent-soft:#eef1f5; --warn:#b45309; --error:#c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 360px; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.container { padding: 18px 20px 22px; }

/* 顶栏 */
.header { display: flex; align-items: center; gap: 9px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.title { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
.ver { margin-left: auto; color: var(--muted); font-size: 10px; font-weight: 600; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }

/* 分组标题 */
.section-title { margin: 20px 0 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }

/* 设置行 */
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 10px; margin: 0 -10px; border-radius: 8px; border-bottom: 1px solid var(--line); transition: background .12s; }
.row:hover { background: var(--soft); }
.row:last-of-type { border-bottom: none; }
.row label { color: #2b2f36; font-size: 13px; cursor: pointer; flex: 1; }

/* 开关 */
.toggle { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); cursor: pointer; flex-shrink: 0; transition: background .18s ease; }
.toggle.on { background: var(--accent); }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s ease; }
.toggle.on::after { transform: translateX(16px); }

/* 倍速滑杆 */
.range-wrap { margin: 12px 0 4px; }
.range-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.range-head span { color: var(--muted); font-size: 11px; }
.range-head .val { color: var(--fg); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; height: 4px; border-radius: 999px; background: var(--line-strong); outline: none; -webkit-appearance: none; cursor: pointer; }
input[type="range"]::-webkit-slider-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); -webkit-appearance: none; transition: transform .12s; }
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }

/* 表单 */
.field { margin-top: 14px; }
.field label { display: block; margin-bottom: 6px; color: #2b2f36; font-size: 12px; font-weight: 500; }
input[type="text"], input[type="password"], select { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--fg); outline: none; padding: 9px 10px; font-size: 12px; transition: border-color .15s, box-shadow .15s; }
input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
.hint b { color: #4a5058; font-weight: 600; }

/* 按钮 */
.actions { margin-top: 20px; display: flex; gap: 8px; }
.btn { flex: 1; padding: 11px 0; border: none; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; font-size: 12.5px; font-weight: 650; transition: opacity .15s, transform .08s; }
.btn:hover { opacity: .88; }
.btn:active { transform: scale(.985); }
.btn.secondary { border: 1px solid var(--line-strong); background: #fff; color: #4a5058; }
.btn.secondary:hover { background: var(--soft); opacity: 1; }

/* 提示条 */
.toast { min-height: 16px; margin-top: 12px; opacity: 0; color: #4a5058; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; text-align: center; font-size: 11px; line-height: 1.9; transition: opacity .2s; }
.toast.show { opacity: 1; }

/* 运行日志 */
.log-panel { display: none; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; max-height: 240px; overflow: auto; background: var(--soft); font-size: 11px; line-height: 1.55; }
.log-panel.show { display: block; }
.log-item { padding: 7px 2px; border-bottom: 1px solid var(--line); }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.log-level.warn { color: var(--warn); }
.log-level.error { color: var(--error); }
.log-panel::-webkit-scrollbar { width: 8px; }
.log-panel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="dot"></div>
    <div class="title">Omitone-1.1.2</div>
    <span class="ver">1.1.2</span>
  </div>

  <div class="section-title">播放与任务</div>
  <div class="range-wrap">
    <div class="range-head">
      <span>播放速度</span>
      <span class="val" id="rateVal">1.0x</span>
    </div>
    <input type="range" id="rate" min="0.5" max="3" step="0.1" value="1.0">
  </div>

  <div class="row">
    <label for="autoMaxRate">自动倍速（跟随视频最大倍速）</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="autoMaxRate"></div>
  </div>
  <div class="row">
    <label for="enableSeek">可拖动视频直接拖到结尾</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="enableSeek"></div>
  </div>
  <div class="row">
    <label for="advanceAtNinetyPercent">防拖拽视频看到 90% 就进下一个</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="advanceAtNinetyPercent"></div>
  </div>
  <div class="row">
    <label for="muted">静音</label>
    <div class="toggle" role="switch" tabindex="0" aria-checked="false" id="muted"></div>
  </div>
  <div class="row">
    <label for="audioMuted">音频静音播放（音频自动用最大倍速）</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="audioMuted"></div>
  </div>
  <div class="row">
    <label for="autoNext">自动下一节</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="autoNext"></div>
  </div>
  <div class="row">
    <label for="enableQuiz">AI 自动答题（关闭后只刷课不答题）</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="enableQuiz"></div>
  </div>
  <div class="row">
    <label for="enableCaptcha">自动识别验证码（独立于 AI 答题，需视觉模型）</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="enableCaptcha"></div>
  </div>
  <div class="row">
    <label for="enableDiscussion">讨论任务点自动发评论（跳转后自动返回）</label>
    <div class="toggle on" role="switch" tabindex="0" aria-checked="true" id="enableDiscussion"></div>
  </div>
  <div class="field">
    <label for="discussionReply">讨论回复内容</label>
    <input id="discussionReply" type="text" placeholder="1" />
  </div>
  <div class="row">
    <label for="restudy">已完成任务重学</label>
    <div class="toggle" role="switch" tabindex="0" aria-checked="false" id="restudy"></div>
  </div>

  <div class="section-title">API</div>
  <div class="field">
    <label for="providerPreset">接入方式</label>
    <select id="providerPreset">
      <option value="deepseek">DeepSeek（唯一在真实答题中实测通过）</option>
      <option value="claude">Anthropic Claude（协议已适配 · 未实测）</option>
      <option value="gemini">Google Gemini（协议已适配 · 未实测）</option>
      <option value="custom-openai">自定义 OpenAI 兼容</option>
    </select>
  </div>
  <p class="hint">
    只预置了真正验证过的服务商。用别家（通义 / 智谱 / Kimi / OpenRouter / 硅基流动 …）请选
    <b>自定义 OpenAI 兼容</b>，API URL 与模型名按厂商文档自己填 ——
    那两格填什么都能用，反而预置好的模型名是钉死的快照，厂商一发新版就失效。
  </p>
  <div class="field">
    <label for="apiType">协议类型</label>
    <select id="apiType">
      <option value="openai">OpenAI 兼容</option>
      <option value="claude">Anthropic / Claude</option>
      <option value="gemini">Google Gemini</option>
    </select>
  </div>
  <div class="field">
    <label for="apiUrl">API URL</label>
    <input type="text" id="apiUrl">
  </div>
  <div class="field">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey">
  </div>
  <div class="field">
    <label for="model">模型名</label>
    <input type="text" id="model">
  </div>
  <div class="field">
    <label for="captchaModel">验证码识别模型（需视觉模型，留空用主模型）</label>
    <input type="text" id="captchaModel" placeholder="填支持图片输入的模型名，如 gemini-flash-latest / qwen-vl-max" />
  </div>

  <div class="actions">
    <button class="btn secondary" id="reset">恢复默认</button>
    <button class="btn secondary" id="saveApi">保存 API</button>
    <button class="btn" id="start">开始运行</button>
  </div>
  <div class="actions">
    <button class="btn secondary" id="testApi">检测 API 连接</button>
  </div>
  <div class="actions">
    <button class="btn secondary" id="toggleLogs">查看日志</button>
    <button class="btn secondary" id="clearLogs">清空日志</button>
    <button class="btn secondary" id="stop">停止运行</button>
  </div>

  <div class="log-panel" id="logPanel"></div>

  <div class="toast" id="toast"></div>
</div>
<script src="../libs/api-url.js"></script>
<script src="popup.js"></script>
</body>
</html>
